; ============================================================================================
; Iris settings for Config/DefaultEngine.ini ([SystemSettings] block below)
; ============================================================================================
; Build side: Source/MassBubble/MassBubble.Build.cs calls SetupIrisSupport(Target).
; Iris is always compiled in (UE 5.7+), so the *.Target.cs files need no bUseIris flag.
; If the editor / UBT reports that Iris is missing, enable the plugin in MassBubble.uproject:
;     "Plugins": [ ..., { "Name": "Iris", "Enabled": true } ]
; ============================================================================================

[SystemSettings]
; Required by Iris: replicated sub objects go through the registered sub object list.
net.SubObjects.DefaultUseSubObjectReplicationList=1

; The crowd bubble is push based (MARK_PROPERTY_DIRTY_FROM_NAME), so Push Model has to be on.
net.IsPushModelEnabled=1

; Iris on. Per process override (A/B test):  -UseIrisReplication=0   /   -UseIrisReplication=1
; Server and clients must use the same replication system: start BOTH with the same switch.
net.Iris.UseIrisReplication=1

; --------------------------------------------------------------------------------------------
; Optional: pin values of the streaming profile (Source/MassBubble/Core/MassBubbleRuntimeConfig.cpp).
; Values in [SystemSettings] win over the code defaults. Check the result with the console command:  opt.stream.Dump
; The last two are SERVER values: keep them in the dedicated server config / command line, not in the shared file.
; --------------------------------------------------------------------------------------------
;s.ForceGCAfterLevelStreamedOut=0
;s.LevelStreamingActorsUpdateTimeLimit=3.0
;s.PriorityLevelStreamingActorsUpdateExtraTime=2.0
;s.LevelStreamingComponentsRegistrationGranularity=4
;s.UnregisterComponentsTimeLimit=1.0
;s.LevelStreamingComponentsUnregistrationGranularity=2
;wp.Runtime.BlockOnSlowStreaming=0
;wp.Runtime.MaxLoadingLevelStreamingCells=2
