[SystemSettings]
; Without this the dedicated server keeps EVERY cell loaded. With it, the server streams cells
; only around streaming sources (player controllers + AMassBubbleStreamingAnchor / virtual viewers).
wp.Runtime.EnableServerStreaming=1
; Also unload cells when no source references them any more.
wp.Runtime.EnableServerStreamingOut=1

; Required by Iris: replicated sub objects go through the registered sub object list.
net.SubObjects.DefaultUseSubObjectReplicationList=1

; The crowd bubble is push based (MARK_PROPERTY_DIRTY_FROM_NAME), so Push Model has to be on.
net.IsPushModelEnabled=1

; Iris on. Per process override (A/B test):  -UseIrisReplication=0   /   -UseIrisReplication=1
; Server and clients must use the same replication system: start BOTH with the same switch.
net.Iris.UseIrisReplication=1

